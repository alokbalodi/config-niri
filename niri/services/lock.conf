# =====================================================
# General
# =====================================================

general {
    disable_loading_bar = true
}

# =====================================================
# Background
# =====================================================

background {
    monitor =
    path = /home/alokkk/.config/background/Wallpaper26.png
    blur_passes = 1
    blur_size = 4
}

# =====================================================
# Clock
# =====================================================

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = rgba(cdd6f4ff)
    font_size = 80
    font_family = JetBrainsMono Bold
    position = 0, 250
    halign = center
    valign = center
}

# =====================================================
# Date
# =====================================================

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d %Y')"
    color = rgba(a6adc8ff)
    font_size = 18
    font_family = JetBrainsMono
    position = 0, 160
    halign = center
    valign = center
}

# =====================================================
# Greeting
# =====================================================

label {
    monitor =
    text = Welcome back
    color = rgba(89b4faff)
    font_size = 14
    font_family = JetBrainsMono
    position = 0, 120
    halign = center
    valign = center
}

# =====================================================
# Password Input
# =====================================================

input-field {
    monitor =
    size = 280, 55
    position = 0, 40
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    outer_color = rgb(89b4fa)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fail_text = <i>Wrong password</i>
    capslock_color = rgb(f9e2af)
}

# =====================================================
# Battery
# =====================================================

label {
    monitor =
    text = cmd[update:30000] awk '{print $1"%"}' /sys/class/power_supply/BAT0/capacity
    color = rgba(a6e3a1ff)
    font_size = 14
    font_family = JetBrainsMono
    position = 0, 20
    halign = center
    valign = bottom
}
